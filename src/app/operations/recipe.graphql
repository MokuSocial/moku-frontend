query Recipe($id: Int!) {
  recipe(id: $id) {
    id
    title
    bannerUrl
    servings
    voteAverage
    ingredients {
      id
      name
      unit
      quantity
    }
    indications {
      prepTime
      cookTime
      restTime
      difficulty
    }
    steps {
      stepNumber
      description
      imageUrl
    }
    author {
      name
      avatarUrl
    }
  }
}
