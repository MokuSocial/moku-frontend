<ion-content>
  <ion-list lines="none">
    <div class="container">
      @for (recipe of recipes(); track recipe.id) {
      <ion-card button [routerLink]="['/recipe', recipe.id]" class="recipe-card">
        <ion-img
          [src]="recipe.bannerUrl || 'assets/images/placeholder.png'"
          appImgFallback="assets/images/placeholder.png"
          class="card-bg"
        />
        <div class="overlay">
          <div class="top-row">
            <div class="stars-badge">
              @for(star of this.getStars(recipe.voteAverage); track $index){
              <ion-icon [name]="star" class="star"></ion-icon>
              }
            </div>
          </div>
          <div class="bottom-row">
            <ion-text class="ion-text-start">
              <h3>{{ recipe.title }}</h3>
            </ion-text>
            <ion-text class="ion-text-end">
              <p>{{ recipe.author.name }}</p>
            </ion-text>
          </div>
        </div>
      </ion-card>
      }
    </div>
  </ion-list>

  @if (recipesResource.error()) {
  <ion-alert
    header="Error"
    [message]="recipesResource.error()"
    isOpen="true"
    [buttons]="['Ok']"
  />
  } @if (recipesResource.isLoading() && recipes().length === 0) {
  <ion-list class="ion-padding-top">
    <div class="container">
      @for (i of range(5); track i) {
      <ion-item lines="none" class="ion-padding-bottom">
        <ion-avatar slot="start">
          <ion-skeleton-text></ion-skeleton-text>
        </ion-avatar>
        <ion-skeleton-text animated style="width: 100%; height: 200px" />
      </ion-item>
      }
    </div>
  </ion-list>
  }

  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more data..."
    />
  </ion-infinite-scroll>
</ion-content>
